services:
  backend:
    build:
      context: ..
    container_name: bean-pattern-backend-dev
    restart: unless-stopped
    entrypoint: ["java", "-jar", "/app/app.jar", "--spring.profiles.active=dev", "--server.port=8082"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      APP_BASE_URL: ${APP_BASE_URL:-http://106.53.119.137:8082}
      APP_UPLOAD_DIR: /app/uploads
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_SECRET_ID: ${SMS_SECRET_ID:-}
      SMS_SECRET_KEY: ${SMS_SECRET_KEY:-}
      SMS_SDK_APP_ID: ${SMS_SDK_APP_ID:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_ID: ${SMS_TEMPLATE_ID:-}
      SMS_REGION: ${SMS_REGION:-ap-guangzhou}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-guangzhou}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-false}
      S3_URL_INCLUDE_BUCKET: ${S3_URL_INCLUDE_BUCKET:-false}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ../data/backend-dev/uploads:/app/uploads

  admin:
    build:
      context: ../../bean-pattern-admin
      args:
        NGINX_CONF: deploy/admin.dev.nginx.conf
    container_name: bean-pattern-admin-dev
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
