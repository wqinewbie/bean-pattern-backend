services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: bean-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  backend:
    build:
      context: ..
    container_name: bean-pattern-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      APP_BASE_URL: ${APP_BASE_URL:-http://106.53.119.137}
      APP_UPLOAD_DIR: /app/uploads
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-midas}
      MIDAS_OFFER_ID: ${MIDAS_OFFER_ID:-}
      MIDAS_APP_KEY: ${MIDAS_APP_KEY:-}
      MIDAS_SANDBOX_APP_KEY: ${MIDAS_SANDBOX_APP_KEY:-}
      MIDAS_SANDBOX: ${MIDAS_SANDBOX:-false}
      MIDAS_MODE: ${MIDAS_MODE:-short_series_coin}
      MIDAS_NOTIFY_URL: ${MIDAS_NOTIFY_URL:-}
      MIDAS_NOTIFY_TOKEN: ${MIDAS_NOTIFY_TOKEN:-}
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_SERVICE_ENABLED: ${AI_SERVICE_ENABLED:-true}
      AI_MOCK_ENABLED: ${AI_MOCK_ENABLED:-false}
      AI_DEFAULT_MODEL_KEY: ${AI_DEFAULT_MODEL_KEY:-seedream-5-lite}
      AI_CALLBACK_TOKEN: ${AI_CALLBACK_TOKEN:-}
      AI_QUEUE_NAME: ${AI_QUEUE_NAME:-ai.generate.request}
      AI_EXCHANGE_NAME: ${AI_EXCHANGE_NAME:-ai.generate.exchange}
      AI_ROUTING_KEY: ${AI_ROUTING_KEY:-ai.generate}
      AI_TASK_TIMEOUT_MINUTES: ${AI_TASK_TIMEOUT_MINUTES:-15}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_SECRET_ID: ${SMS_SECRET_ID:-}
      SMS_SECRET_KEY: ${SMS_SECRET_KEY:-}
      SMS_SDK_APP_ID: ${SMS_SDK_APP_ID:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_ID: ${SMS_TEMPLATE_ID:-}
      SMS_REGION: ${SMS_REGION:-ap-guangzhou}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-guangzhou}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-false}
      S3_URL_INCLUDE_BUCKET: ${S3_URL_INCLUDE_BUCKET:-false}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rabbitmq
    ports:
      - "8081:8081"
    volumes:
      - ../data/backend/uploads:/app/uploads

  admin:
    build:
      context: ../../bean-pattern-admin
      args:
        NGINX_CONF: deploy/admin.nginx.conf
    container_name: bean-pattern-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  rabbitmq_data:
