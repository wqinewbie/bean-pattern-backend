spring:
  application:
    name: bean-pattern-backend
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  # 后端端口，小程序里 API_BASE_URL 要和这里一致
  port: 8081

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

payment:
  provider: ${PAYMENT_PROVIDER:mock}
  mock:
    auto-paid: ${PAYMENT_MOCK_AUTO_PAID:true}
  midas:
    app-id: ${MIDAS_APP_ID:${WECHAT_APP_ID:}}
    offer-id: ${MIDAS_OFFER_ID:}
    app-key: ${MIDAS_APP_KEY:}
    sandbox-app-key: ${MIDAS_SANDBOX_APP_KEY:}
    notify-url: ${MIDAS_NOTIFY_URL:https://api.pindo.asia/api/pay/midas/notify}
    notify-token: ${MIDAS_NOTIFY_TOKEN:}
    sandbox: ${MIDAS_SANDBOX:true}
    mode: ${MIDAS_MODE:short_series_coin}

app:
  # 本地上传目录（相对项目根目录）
  upload-dir: ./uploads
  # 文件外链拼接基础地址（例如上传后返回的图片 URL）
  base-url: http://localhost:8080
  jwt:
    # JWT签名密钥（生产环境通过环境变量注入）
    secret: ${JWT_SECRET:dev-secret-change-me-in-production}
  wechat:
    # 微信小程序真实配置：建议通过环境变量注入
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    review-task-result-template-id: ${WECHAT_REVIEW_TASK_RESULT_TEMPLATE_ID:}
  ai:
    # AI 图片处理接口地址与密钥（未配置时走降级：返回原图 URL）
    api-url: ${AI_API_URL:}
    api-key: ${AI_API_KEY:}
  ai-service:
    enabled: ${AI_SERVICE_ENABLED:false}
    default-model-key: ${AI_DEFAULT_MODEL_KEY:seedream-5-lite}
    callback-token: ${AI_CALLBACK_TOKEN:dev-ai-callback-token}
    queue-name: ${AI_QUEUE_NAME:ai.generate.request}
    exchange-name: ${AI_EXCHANGE_NAME:ai.generate.exchange}
    routing-key: ${AI_ROUTING_KEY:ai.generate}
    task-timeout-minutes: ${AI_TASK_TIMEOUT_MINUTES:15}
