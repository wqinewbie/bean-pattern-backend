server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://host.docker.internal:3306/bean_pattern?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&connectionCollation=utf8mb4_unicode_ci}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:host.docker.internal}
      port: ${REDIS_PORT:6379}

  sql:
    init:
      mode: never

app:
  upload-dir: ${APP_UPLOAD_DIR:/app/uploads}
  base-url: ${APP_BASE_URL:http://localhost}

  s3:
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:ap-guangzhou}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
    url-include-bucket: ${S3_URL_INCLUDE_BUCKET:true}
    public-base-url: ${S3_PUBLIC_BASE_URL:}

  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}

  ai:
    api-url: ${AI_API_URL:}
    api-key: ${AI_API_KEY:}

  sms:
    enabled: ${SMS_ENABLED:false}
    secret-id: ${SMS_SECRET_ID:}
    secret-key: ${SMS_SECRET_KEY:}
    sdk-app-id: ${SMS_SDK_APP_ID:}
    sign-name: ${SMS_SIGN_NAME:}
    template-id: ${SMS_TEMPLATE_ID:}
    region: ${SMS_REGION:ap-guangzhou}
    code-ttl-seconds: ${SMS_CODE_TTL_SECONDS:300}
